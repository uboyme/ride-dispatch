spring:
  application:
    name: ride-dispatch
  datasource:
    url: jdbc:mysql://localhost:3307/ride_dispatch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

ride-dispatch:
  cancellation-fee: "5.00"
  free-cancellation-minutes: 3
  dispatch-radius-km: 3
  candidate-driver-limit: 10
  geo-key-prefix: "driver:geo:"
  # 司机多少秒不响应算接单超时,yml 里的短横线写法 accept-timeout-seconds，会自动对应 Java 里的驼峰 acceptTimeoutSeconds
  accept-timeout-seconds: 15
  # 待派单超过多少分钟仍派不出去，系统自动取消
  dispatch-give-up-minutes: 5
  # 定时扫描间隔（毫秒），上一轮结束后再等这么久
  scan-interval-ms: 5000
